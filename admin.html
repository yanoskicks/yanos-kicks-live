<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanos Kicks — Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          colors: {
            ink: { 950: "#0c0e12", 900: "#12151c", 800: "#1a1f2a", 700: "#252b38" },
            accent: { DEFAULT: "#84a96e", muted: "#6b8c56" },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-ink-950 text-slate-200 antialiased font-sans">
  <div id="appRoot" class="min-h-screen flex flex-col">
    <!-- Login -->
    <section id="loginGate" class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-md rounded-2xl border border-white/10 bg-ink-900/80 p-8 shadow-2xl backdrop-blur">
        <div class="mb-8 text-center">
          <p class="text-[10px] uppercase tracking-[0.35em] text-accent font-semibold">Yanos Kicks</p>
          <h1 class="mt-2 text-2xl font-semibold tracking-tight text-white">Admin</h1>
          <p class="mt-2 text-sm text-slate-400">Sign in with the authorized Google account (yanoskicks@gmail.com).</p>
        </div>
        <p id="loginError" class="mb-4 hidden text-center text-sm text-red-400"></p>
        <button
          type="button"
          id="googleSignInBtn"
          class="flex w-full items-center justify-center gap-3 rounded-lg border border-white/15 bg-white py-3 text-sm font-semibold text-ink-950 transition hover:bg-slate-100"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>
    </section>

    <!-- Dashboard (hidden until auth) -->
    <section id="dashboard" class="hidden flex-1 flex flex-col">
      <header class="border-b border-white/10 bg-ink-900/90 px-4 py-4 sm:px-8">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-[10px] uppercase tracking-[0.35em] text-accent">Operations</p>
            <h1 class="text-xl font-semibold text-white">Orders</h1>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <span id="adminEmailLabel" class="text-xs text-slate-400"></span>
            <button
              type="button"
              id="logoutBtn"
              class="rounded-lg border border-white/15 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-slate-200 hover:bg-white/5"
            >
              Log out
            </button>
            <button
              type="button"
              id="refreshBtn"
              class="rounded-lg bg-accent px-4 py-2 text-xs font-semibold uppercase tracking-wider text-ink-950 hover:bg-accent-muted"
            >
              Refresh
            </button>
          </div>
        </div>
      </header>

      <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-8">
        <div id="loadBanner" class="mb-6 hidden rounded-lg border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-sm text-amber-200">
          Loading orders…
        </div>
        <div id="errorBanner" class="mb-6 hidden rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200"></div>

        <div class="mb-8 grid gap-4 sm:grid-cols-3">
          <div class="rounded-xl border border-white/10 bg-ink-900 p-6">
            <p class="text-xs font-medium uppercase tracking-wider text-slate-500">Total orders</p>
            <p id="statCount" class="mt-2 text-3xl font-semibold text-white">—</p>
          </div>
          <div class="rounded-xl border border-white/10 bg-ink-900 p-6 sm:col-span-2">
            <p class="text-xs font-medium uppercase tracking-wider text-slate-500">Revenue (Paid / Shipped)</p>
            <p id="statRevenue" class="mt-2 text-3xl font-semibold text-accent">—</p>
            <p class="mt-1 text-xs text-slate-500">Uses <code class="text-slate-400">totalAmount</code> in ZAR from qualifying orders only.</p>
          </div>
        </div>

        <div id="ordersEmpty" class="hidden rounded-xl border border-dashed border-white/15 bg-ink-900/50 py-16 text-center text-slate-500">
          No orders found.
        </div>
        <div id="ordersList" class="space-y-4"></div>
      </main>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collectionGroup,
      query,
      orderBy,
      getDocs,
      doc,
      updateDoc,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const CONFIG_ENDPOINT = "https://getconfig-yggxusmprq-bq.a.run.app";
    /** Must match `isAdmin()` in firestore.rules */
    const AUTHORIZED_ADMIN_UID = "vqc5xx018tayOmyxt6BfKkCdVID2";

    const $ = (id) => document.getElementById(id);

    async function loadRemoteConfig() {
      const res = await fetch(CONFIG_ENDPOINT);
      if (!res.ok) throw new Error("Config HTTP " + res.status);
      const body = await res.json();
      const cfg = body.firebaseConfig;
      if (!cfg || !cfg.apiKey || !cfg.projectId) throw new Error("Invalid firebase config");
      return cfg;
    }

    const firebaseConfig = await loadRemoteConfig();
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginGate = $("loginGate");
    const dashboard = $("dashboard");
    const loginError = $("loginError");
    const googleSignInBtn = $("googleSignInBtn");
    const logoutBtn = $("logoutBtn");
    const refreshBtn = $("refreshBtn");
    const adminEmailLabel = $("adminEmailLabel");
    const loadBanner = $("loadBanner");
    const errorBanner = $("errorBanner");
    const ordersList = $("ordersList");
    const ordersEmpty = $("ordersEmpty");
    const statCount = $("statCount");
    const statRevenue = $("statRevenue");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.remove("hidden");
    }
    function clearError() {
      errorBanner.classList.add("hidden");
      errorBanner.textContent = "";
    }

    function formatZar(n) {
      const v = Number(n) || 0;
      return "R " + v.toLocaleString("en-ZA", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function formatDate(data) {
      if (data.date) return new Date(data.date).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" });
      if (data.createdAt && typeof data.createdAt.toDate === "function") {
        return data.createdAt.toDate().toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" });
      }
      return "—";
    }

    function itemSummary(data) {
      const items = Array.isArray(data.items) ? data.items : [];
      if (!items.length) return "—";
      return items.map((i) => `${i.qty || 1}× ${i.title || "Item"}`).join(" · ");
    }

    function countsAsRevenue(status) {
      const s = String(status || "");
      return s.includes("Paid") || s.includes("Shipped");
    }

    function canMarkShipped(status) {
      return String(status || "").includes("Paid");
    }

    function waDigits(phone) {
      return String(phone || "").replace(/\D/g, "");
    }

    function renderOrders(snapshot) {
      const docs = snapshot.docs.map((d) => ({ id: d.id, ref: d.ref, path: d.ref.path, data: d.data() }));

      let revenue = 0;
      for (const { data } of docs) {
        if (countsAsRevenue(data.status)) revenue += Number(data.totalAmount) || 0;
      }

      statCount.textContent = String(docs.length);
      statRevenue.textContent = formatZar(revenue);

      if (!docs.length) {
        ordersEmpty.classList.remove("hidden");
        ordersList.innerHTML = "";
        return;
      }
      ordersEmpty.classList.add("hidden");

      ordersList.innerHTML = docs
        .map(({ ref, data }) => {
          const name = data.customerName || "—";
          const email = data.customerEmail || "—";
          const phone = data.customerPhone || "";
          const wa = waDigits(phone);
          const msg = encodeURIComponent(
            `Hi ${name}, it’s Yanos Kicks — update on your order (${data.reference || ""}).`
          );
          const waHref = wa ? `https://wa.me/${wa}?text=${msg}` : "#";
          const shipDisabled = !canMarkShipped(data.status);
          const shipClass = shipDisabled
            ? "cursor-not-allowed opacity-40"
            : "hover:bg-accent-muted bg-accent text-ink-950";

          return `
          <article class="rounded-xl border border-white/10 bg-ink-900 p-5 shadow-lg sm:p-6">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
              <div class="space-y-1">
                <span class="inline-flex rounded-full border px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider ${
                  String(data.status || "").includes("Shipped")
                    ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-300"
                    : String(data.status || "").includes("Paid")
                      ? "border-sky-500/40 bg-sky-500/10 text-sky-200"
                      : "border-white/15 bg-white/5 text-slate-300"
                }">${escapeHtml(String(data.status || "—"))}</span>
                <p class="text-lg font-semibold text-white">${escapeHtml(itemSummary(data))}</p>
                <p class="text-xs text-slate-500">Ref <span class="font-mono text-slate-300">${escapeHtml(String(data.reference || "—"))}</span> · ${escapeHtml(formatDate(data))}</p>
              </div>
              <p class="text-right text-xl font-semibold text-white">${formatZar(data.totalAmount)}</p>
            </div>
            <dl class="mt-4 grid gap-3 border-t border-white/10 pt-4 text-sm sm:grid-cols-2">
              <div><dt class="text-xs uppercase tracking-wider text-slate-500">Customer</dt><dd class="text-slate-200">${escapeHtml(name)}</dd></div>
              <div><dt class="text-xs uppercase tracking-wider text-slate-500">Email</dt><dd class="break-all text-slate-200">${escapeHtml(email)}</dd></div>
              <div class="sm:col-span-2"><dt class="text-xs uppercase tracking-wider text-slate-500">Address</dt><dd class="text-slate-200">${escapeHtml(String(data.deliveryAddress || "—"))}</dd></div>
            </dl>
            <div class="mt-5 flex flex-wrap gap-3">
              <a href="${wa ? waHref : "#"}" ${wa ? 'target="_blank" rel="noopener"' : ""} class="inline-flex items-center justify-center rounded-lg border border-white/15 px-4 py-2 text-xs font-semibold uppercase tracking-wider ${
                wa ? "text-white hover:bg-white/10" : "pointer-events-none cursor-not-allowed opacity-40"
              }">WhatsApp</a>
              <button type="button" data-ship="${ref.path}" class="ship-btn inline-flex items-center justify-center rounded-lg px-4 py-2 text-xs font-semibold uppercase tracking-wider ${shipClass}" ${
                shipDisabled ? "disabled" : ""
              }">Mark shipped</button>
            </div>
          </article>`;
        })
        .join("");

      ordersList.querySelectorAll(".ship-btn").forEach((btn) => {
        if (btn.disabled) return;
        btn.addEventListener("click", async () => {
          const path = btn.getAttribute("data-ship");
          const parts = path.split("/").filter(Boolean);
          const docRef = doc(db, ...parts);
          btn.disabled = true;
          try {
            await updateDoc(docRef, { status: "Shipped", shippedAt: serverTimestamp() });
            await loadOrders();
          } catch (e) {
            console.error(e);
            showError("Could not update order. Check Firestore rules and admin UID.");
            btn.disabled = false;
          }
        });
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadOrders() {
      clearError();
      loadBanner.classList.remove("hidden");
      try {
        const q = query(collectionGroup(db, "orders"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        renderOrders(snap);
      } catch (e) {
        console.error(e);
        showError(
          e?.message?.includes("index") || e?.code === "failed-precondition"
            ? "Firestore index may still be building. Wait a few minutes after deploying indexes, then refresh."
            : "Failed to load orders: " + (e?.message || e)
        );
      } finally {
        loadBanner.classList.add("hidden");
      }
    }

    googleSignInBtn.addEventListener("click", async () => {
      loginError.classList.add("hidden");
      googleSignInBtn.disabled = true;
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err?.code !== "auth/popup-closed-by-user") {
          loginError.textContent = err?.message || "Google sign-in failed";
          loginError.classList.remove("hidden");
        }
      } finally {
        googleSignInBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));
    refreshBtn.addEventListener("click", () => loadOrders());

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (user.uid !== AUTHORIZED_ADMIN_UID) {
          loginError.textContent = "This Google account is not authorized for admin access.";
          loginError.classList.remove("hidden");
          await signOut(auth);
          return;
        }
        loginError.classList.add("hidden");
        loginGate.classList.add("hidden");
        dashboard.classList.remove("hidden");
        adminEmailLabel.textContent = user.email || user.uid;
        loadOrders();
      } else {
        dashboard.classList.add("hidden");
        loginGate.classList.remove("hidden");
        adminEmailLabel.textContent = "";
        ordersList.innerHTML = "";
        statCount.textContent = "—";
        statRevenue.textContent = "—";
      }
    });
  </script>
</body>
</html>
